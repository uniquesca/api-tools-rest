name: Release new version

on:
  push:
    tags:
      - '*'

jobs:
  publish-release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        uses: uniquesca/ci/github-release@main
        with:
          release_version: ${{ github.ref_name }}
          rescan_satis: true
          satis_rebuild_token: ${{ secrets.SATIS_REBUILD_PUBLIC_TOKEN }}
